)\nprint(s)\nprint(s == Student(\"Sara\", 11, [\"Math\"]))\n", "from dataclasses import dataclass\n\n@dataclass(frozen=True, order=True)\nclass Version:\n    major: int\n    minor: int = 0\n\nprint(Version(1, 2) < Version(1, 10))\nv = Version(2)\ntry:\n    v.major = 3\nexcept Exception as error:\n    print(type(error).__name__)\n", "class Book:\n    def __init__(self, title, author):\n        self.title = title\n        self.author = author\n        self.available = True\n\n    def __repr__(self):\n        status = \"available\" if self.available else \"borrowed\"\n        return f\"Book({self.title!r}, {status})\"\n\n\nclass Library:\n    def __init__(self):\n        self._books = {}\n\n    def add_book(self, book):\n        self._books[book.title] = book\n\n    def borrow(self, title):\n        book = self._books.get(title)\n        if book is None:\n            raise KeyError(f\"No such book: {title}\")\n        if not book.available:\n            raise ValueError(f\"{title} is already borrowed\")\n        book.available = False\n        return book\n\n    def give_back(self, title):\n        self._books[title].available = True\n\n    def available_titles(self):\n        return sorted(t for t, b in self._books.items() if b.available)\n\n\nlib = Library()\nlib.add_book(Book(\"Dune\", \"Herbert\"))\nlib.add_book(Book(\"Emma\", \"Austen\"))\nprint(lib.borrow(\"Dune\"))\nprint(lib.available_titles())\ntry:\n    lib.borrow(\"Dune\")\nexcept ValueError as error:\n    print(\"Error:\", error)\nlib.give_back(\"Dune\")\nprint(lib.available_titles())\n", "# 1\nclass Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n\n    def area(self):\n        return self.width * self.height\n\n    def perimeter(self):\n        return 2 * (self.width + self.height)\n\n    def __str__(self):\n        return f\"Rectangle {self.width}x{self.height}\"\n\nr = Rectangle(4, 3)\nprint(r, r.area(), r.perimeter())\n\n# 2\nclass Vehicle:\n    def __init__(self, wheels):\n        self.wheels = wheels\n\n    def describe(self):\n        return f\"{type(self).__name__} with {self.wheels} wheels\"\n\nclass Car(Vehicle):\n    def __init__(self):\n        super().__init__(4)\n\nclass Bike(Vehicle):\n    def __init__(self):\n        super().__init__(2)\n\nprint(Car().describe())\nprint(Bike().describe())\n\n# 3\nclass Circle:\n    def __init__(self, radius):\n        self.radius = radius\n\n    @property\n    def radius(self):\n        return self._radius\n\n    @radius.setter\n    def radius(self, value):\n        if value <= 0:\n            raise ValueError(\"Radius must be positive\")\n        self._radius = value\n\nc = Circle(2)\nc.radius = 5\nprint(c.radius)\ntry:\n    c.radius = -1\nexcept ValueError as error:\n    print(error)\n\n# 4\nfrom dataclasses import dataclass\n\n@dataclass\nclass Product:\n    name: str\n    price: float\n    quantity: int = 1\n\n    def total(self):\n        return self.price * self.quantity\n\nprint(Product(\"Pen\", 1.5, 4).total())\n\n# 5\nfrom abc import ABC, abstractmethod\n\nclass Employee(ABC):\n    @abstractmethod\n    def pay(self):\n        ...\n\nclass Salaried(Employee):\n    def __init__(self, monthly):\n        self.monthly = monthly\n\n    def pay(self):\n        return self.monthly\n\nclass Hourly(Employee):\n    def __init__(self, rate, hours):\n        self.rate = rate\n        self.hours = hours\n\n    def pay(self):\n        return self.rate * self.hours\n\nprint(sum(e.pay() for e in [Salaried(3000), Hourly(20, 100)]))\n"]}]}]};
const app=document.getElementById('app');let py=null;let courseKey=null;
const BYTE_LAB_ENDPOINT=(window.BYTE_LAB_CONFIG||{}).endpoint||"";
const GA_MEASUREMENT_ID=(window.BYTE_LAB_CONFIG||{}).gaMeasurementId||"";
function learnerId(){return localStorage.getItem('bl_learner_id')||''}
function visitorId(){let id=localStorage.getItem('bl_visitor_id');if(!id){id='VIS-'+crypto.randomUUID().replaceAll('-','').slice(0,12).toUpperCase();localStorage.setItem('bl_visitor_id',id)}return id}
function loadGA(){const id=GA_MEASUREMENT_ID;if(!id||id==='G-REPLACE_ME')return;window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(id);document.head.appendChild(s);gtag('js',new Date());gtag('config',id)}
function track(eventName,params={}){try{if(window.gtag)gtag('event',eventName,params)}catch(e){};if(BYTE_LAB_ENDPOINT){try{fetch(BYTE_LAB_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'event',event:eventName,learnerId:learnerId(),visitorId:visitorId(),course:courseKey||'',...params,timestamp:new Date().toISOString()})})}catch(e){}}}
function loadProgress(k){try{return JSON.parse(localStorage.getItem('bl_py_'+k))||{}}catch(e){return{}}}
function saveProgress(k,p){try{localStorage.setItem('bl_py_'+k,JSON.stringify(p))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function allLessons(k){return COURSES[k].flatMap((w,wi)=>w.lessons.map((l,li)=>({...l,wi,li,week:w.title})))}
function courseName(k){return k==='beginner'?'Beginner':'Intermediate'}
function home(){
 track('page_view',{page:'learn_home'});
 app.innerHTML=`<a href="index.html">← Back to ByteLab</a><h1>Python Learning Paths</h1><p>Long-form lessons, worked examples, weekly practice, and an in-browser Python IDE. Your progress is saved locally in this browser.</p>
 <div class="grid">${Object.entries(COURSES).map(([k,weeks])=>{let total=allLessons(k).length,p=loadProgress(k),n=Object.keys(p).length;let claimed=false;return `<div class="card"><h2>${courseName(k)} Python</h2><p>${weeks.length} week${weeks.length!==1?'s':''} currently available · ${total} lessons</p><div class="bar"><i style="width:${total?n/total*100:0}%"></i></div><p>${n}/${total} lessons complete</p><button onclick="openCourse('${k}')">Open course</button></div>`}).join('')}</div>`}
function openCourse(k){courseKey=k;track('course_started',{course:k});let weeks=COURSES[k],p=loadProgress(k),total=allLessons(k).length,n=Object.keys(p).length;app.innerHTML=`<div class="sticky"><a href="#" onclick="home();return false">← All courses</a></div><h1>${courseName(k)} Python</h1><p>${n}/${total} lessons complete</p><div class="bar"><i style="width:${total?n/total*100:0}%"></i></div>${weeks.map((w,wi)=>`<section><h2>${w.title}</h2>${w.lessons.map((l,li)=>{let idx=globalIndex(k,wi,li);return `<div class="card row"><div><b>Lesson ${li+1} · ${esc(l.title.replace(/^Lesson [^:]+: /,''))}</b><div class="muted small">${p[idx]?'<span class="done">✓ Complete</span>':'Not started'}</div></div><button onclick="lesson(${wi},${li})">${p[idx]?'Review':'Start'}</button></div>`}).join('')}<div class="card"><h3>Week review</h3><p class="muted">Use the practice and quiz from the supplied course document after finishing the lessons.</p><button class="ghost" onclick="weekReview(${wi})">Open weekly review</button></div></section>`).join('')}`}
function globalIndex(k,wi,li){let n=0;for(let i=0;i<wi;i++)n+=COURSES[k][i].lessons.length;return n+li}
function lesson(wi,li){courseKey=courseKey||'beginner';let w=COURSES[courseKey][wi],l=w.lessons[li],idx=globalIndex(courseKey,wi,li),examples=l.examples||[],p=loadProgress(courseKey);track('lesson_opened',{course:courseKey,lesson:l.title,week:w.title,index:idx});app.innerHTML=`<div class="sticky"><a href="#" onclick="openCourse('${courseKey}');return false">← ${courseName(courseKey)} course</a></div><h1>${esc(l.title)}</h1><div class="lesson-body">${l.html}</div><div class="card"><h2>Python IDE</h2><p class="muted small">This is the same browser-based Python runner style as before. Your code runs locally in the browser through Pyodide.</p>${examples.length?`<div class="example-row"><label for="exampleSelect">Example:</label><select id="exampleSelect">${examples.map((_,i)=>`<option value="${i}">Example ${i+1}</option>`).join('')}</select></div>`:''}<textarea id="code" spellcheck="false">${esc(examples[0]||'')}</textarea><p><button id="run">▶ Run</button> ${examples.length?'<button class="ghost" id="ex">Load selected example</button>':''}</p><pre id="out">Output appears here.</pre></div><div class="card"><h2>Lesson progress</h2><p id="msg">${p[idx]?'<span class="done">✓ Lesson complete</span>':'Run the examples and finish the lesson, then mark it complete.'}</p><button onclick="completeLesson(${idx})">✓ Mark lesson complete</button></div><div class="nav">${li>0?`<button class="ghost" onclick="lesson(${wi},${li-1})">← Previous</button>`:''}${li<w.lessons.length-1?`<button class="ghost" onclick="lesson(${wi},${li+1})">Next →</button>`:`<button class="ghost" onclick="openCourse('${courseKey}')">Back to course</button>`}</div>`;setupIDE(examples)}
function completeLesson(idx){let p=loadProgress(courseKey);p[idx]=1;saveProgress(courseKey,p);let l=allLessons(courseKey)[idx];track('lesson_completed',{course:courseKey,lesson:l?l.title:'',index:idx});document.getElementById('msg').innerHTML='<span class="done">✓ Lesson complete</span>';}
function setupIDE(examples){const code=document.getElementById('code'),runBtn=document.getElementById('run');if(!runBtn)return;const ex=document.getElementById('ex'),sel=document.getElementById('exampleSelect');if(ex)ex.onclick=()=>{code.value=examples[+sel.value]||''};runBtn.onclick=()=>{track('code_run',{course:courseKey});runCode()}}
async function runCode(){const out=document.getElementById('out'),btn=document.getElementById('run');btn.disabled=true;try{if(!py){out.textContent='Loading Python (first run only)...';await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});py=await loadPyodide()}let text='';py.setStdout({batched:s=>text+=s+'\\n'});py.setStderr({batched:s=>text+=s+'\\n'});try{await py.runPythonAsync(document.getElementById('code').value)}catch(e){text+=String(e.message).split('\\n').slice(-4).join('\\n')}out.textContent=text||'(no output)'}catch(e){out.textContent='Could not load Python. Check your internet connection.'}btn.disabled=false}
function weekReview(wi){let w=COURSES[courseKey][wi];let next=COURSES[courseKey][wi+1];let end=next?next.title:'Course end';let all=allLessons(courseKey);let start=globalIndex(courseKey,wi,0),endIdx=start+w.lessons.length;app.innerHTML=`<a href="#" onclick="openCourse('${courseKey}');return false">← ${courseName(courseKey)} course</a><h1>${esc(w.title)} Review</h1><div class="card lesson-body">${w.review_html||'<p>No weekly review was supplied.</p>'}</div><div class="card"><h2>Progress</h2><p>${Object.keys(loadProgress(courseKey)).filter(x=>+x>=start&&+x<endIdx).length}/${w.lessons.length} lessons complete</p><button onclick="openCourse('${courseKey}')">Return to lessons</button></div>`}
loadGA();
visitorId();
track('site_visit',{page:'learn'});
home();
</script></body></html>
