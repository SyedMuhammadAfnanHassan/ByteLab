beginner:{name:"Beginner",sub:"6 weeks · variables to functions",L:[
{t:"Getting Started: print, variables, types",
b:`<p>A program is a list of instructions the computer follows from top to bottom. Python is popular for beginners because its code reads almost like English. The <code>print()</code> function displays output on the screen.</p>
<p>A <b>variable</b> is a name that points to a value. You create one with <code>=</code>, which means "store this value", not "equals" in the maths sense. Python has four basic types: <code>int</code> (whole numbers like 15), <code>float</code> (decimals like 1.65), <code>str</code> (text in quotes) and <code>bool</code> (<code>True</code> or <code>False</code>). You can check a type with <code>type()</code>.</p>
<p>Variable names may contain letters, digits and underscores, cannot start with a digit, and cannot contain spaces. A line starting with <code>#</code> is a comment: Python ignores it, so use comments to explain your code to humans.</p>`,
c:`name = "Ali"   # str
age = 15       # int
height = 1.65  # float
is_student = True  # bool
print("Hello,", name)
print(type(age), type(height), type(is_student))
age = age + 1  # variables can change
print(age)`,
m:`Names are case-sensitive: <code>Age</code> and <code>age</code> are two different variables. Also, text needs quotes: <code>print(Hello)</code> is an error, <code>print("Hello")</code> works.`,
q:[{q:"Which is a valid variable name?",o:["2names","my name","my_name","my-name"],a:2},{q:"What is type(True)?",o:["int","bool","str","float"],a:1},{q:"What does a # do in Python?",o:["Prints text","Starts a comment Python ignores","Ends the program","Makes a list"],a:1}]},
{t:"Input, Operators and Strings",
b:`<p><code>input()</code> pauses the program and reads what the user types. It <b>always returns a string</b>, even if the user types a number, so convert with <code>int()</code> or <code>float()</code> before doing maths.</p>
<p>Arithmetic operators: <code>+</code> add, <code>-</code> subtract, <code>*</code> multiply, <code>/</code> divide (always gives a float), <code>//</code> floor division (drops the decimal part), <code>%</code> remainder, <code>**</code> power. Python follows the usual order of operations, and brackets change it.</p>
<p>Strings can be joined with <code>+</code>, repeated with <code>*</code>, measured with <code>len()</code>, and changed with methods such as <code>.upper()</code>, <code>.lower()</code> and <code>.strip()</code>. The cleanest way to mix text and values is an <b>f-string</b>: put <code>f</code> before the quotes and write variables inside <code>{}</code>.</p>`,
c:`a = 7
b = 2
print(a + b, a - b, a * b)
print(a / b, a // b, a % b, a ** b)
word = "python"
print(word.upper(), len(word), word * 2)
name = "Sara"
print(f"Hello {name}, {a} divided by {b} is {a / b}")
# With input (a pop-up will ask you):
# age = int(input("Age? "))`,
m:`<code>"5" + 3</code> causes an error because you cannot add text and a number. Convert first: <code>int("5") + 3</code>.`,
q:[{q:"What is 7 // 2?",o:["3.5","3","4","1"],a:1},{q:"What type does input() return?",o:["int","float","str","It depends on what is typed"],a:2},{q:"What is 10 % 3?",o:["3","1","0","3.33"],a:1}]},
{t:"Making Decisions: if / elif / else",
b:`<p>Programs need to make choices. An <code>if</code> statement runs its block only when a condition is <code>True</code>. Add <code>elif</code> (else if) for more cases and <code>else</code> for everything left over. Python checks them in order and runs only the <b>first</b> block that matches.</p>
<p>Comparison operators give True or False: <code>==</code> equal, <code>!=</code> not equal, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>. Combine conditions with <code>and</code> (both must be true), <code>or</code> (at least one) and <code>not</code> (flips the result).</p>
<p>The colon <code>:</code> at the end of the line and the <b>indentation</b> (normally 4 spaces) of the next lines are required. Indentation is how Python knows which lines belong inside the block.</p>`,
c:`marks = 72
attendance = 90
if marks >= 80:
    print("A")
elif marks >= 60:
    print("B")
else:
    print("Keep practising")

if marks >= 60 and attendance >= 75:
    print("Eligible for the next level")`,
m:`Using <code>=</code> instead of <code>==</code> in a condition. <code>=</code> stores a value; <code>==</code> compares two values.`,
q:[{q:"Which operator checks equality?",o:["=","==","=>","!"],a:1},{q:"With marks = 72, the example prints:",o:["A","B","Keep practising","Nothing"],a:1},{q:"What is the value of: not True",o:["True","False","None","Error"],a:1}]},
{t:"Loops: for and while",
b:`<p>Loops repeat code so you don't have to write it many times. A <code>for</code> loop goes through a sequence one item at a time. <code>range(n)</code> produces the numbers 0 up to <b>n-1</b>; <code>range(a, b)</code> starts at a and stops before b; <code>range(a, b, step)</code> also sets the step size.</p>
<p>A <code>while</code> loop repeats as long as its condition stays True. Something inside the loop must eventually make the condition False, otherwise you get an infinite loop. <code>break</code> leaves a loop immediately and <code>continue</code> skips to the next round.</p>
<p>A common pattern is an <b>accumulator</b>: a variable that starts at 0 and grows inside the loop, for example to add up numbers.</p>`,
c:`total = 0
for i in range(1, 6):   # 1,2,3,4,5
    total += i
print("Sum:", total)

count = 3
while count > 0:
    print("Countdown", count)
    count -= 1
print("Go!")`,
m:`Forgetting to change the variable in a <code>while</code> loop (here, <code>count -= 1</code>) makes it run forever. If that happens in the editor, refresh the page.`,
q:[{q:"What does range(3) produce?",o:["1, 2, 3","0, 1, 2","0, 1, 2, 3","1, 2"],a:1},{q:"A while loop stops when...",o:["It has run 10 times","Its condition becomes False","Python gets bored","It reaches the last line"],a:1},{q:"for i in range(2, 5) gives:",o:["2, 3, 4, 5","2, 3, 4","3, 4, 5","2, 5"],a:1}]},
{t:"Lists and Dictionaries",
b:`<p>A <b>list</b> keeps items in order and can be changed: <code>[10, 20, 30]</code>. Indexing starts at 0, so the first item is <code>nums[0]</code>, and <code>nums[-1]</code> is the last. Useful tools: <code>append()</code> adds an item, <code>remove()</code> deletes a value, <code>len()</code> counts, <code>sorted()</code> returns a sorted copy, and slicing like <code>nums[1:3]</code> takes a part.</p>
<p>A <b>dictionary</b> stores key-value pairs, like a real dictionary maps a word to a meaning: <code>{"name": "Ali", "grade": "A"}</code>. Read a value with <code>d["name"]</code>, add or change one with <code>d["age"] = 15</code>, and loop with <code>d.items()</code>.</p>
<p>Use a list when order matters, and a dictionary when you want to look things up by a label.</p>`,
c:`nums = [10, 20, 30]
nums.append(40)
print(nums[0], nums[-1], len(nums), nums[1:3])

student = {"name": "Ali", "grade": "A"}
student["age"] = 15
for key, value in student.items():
    print(key, "->", value)`,
m:`Asking for an index that doesn't exist (like <code>nums[10]</code> in a 4-item list) raises an <code>IndexError</code>. A missing dictionary key raises a <code>KeyError</code>.`,
q:[{q:"Index of the first item in a list?",o:["1","0","-1","first"],a:1},{q:"How do you read the value for key 'name' in dict d?",o:["d.name","d(name)","d['name']","d{name}"],a:2},{q:"If nums = [1, 2, 3], what is nums[-1]?",o:["1","2","3","Error"],a:2}]},
{t:"Functions and a Mini Project",
b:`<p>A function is a named, reusable block of code. Define it with <code>def</code>, give it <b>parameters</b> (inputs), and use <code>return</code> to send a result back. Calling <code>average(80, 70, 90)</code> passes <b>arguments</b> into the parameters. A function without a <code>return</code> gives back <code>None</code>.</p>
<p>Good functions do one job and have a clear name. Variables created inside a function exist only there (local scope), which keeps different parts of your program from interfering with each other.</p>
<p><b>Mini project: Grade Calculator.</b> Ask for three marks, compute the average with a function, and print a grade using if/elif/else. The example below shows the structure; try changing the marks and the grade boundaries, then add a fourth mark.</p>`,
c:`def average(a, b, c):
    return (a + b + c) / 3

def grade(avg):
    if avg >= 80:
        return "A"
    elif avg >= 60:
        return "B"
    return "C"

avg = average(80, 70, 90)
print(f"Average: {avg:.1f}, Grade: {grade(avg)}")`,
m:`Writing <code>print(...)</code> inside a function when you meant <code>return</code>. Printing shows a value; returning lets other code use it.`,
q:[{q:"Which keyword sends a value back from a function?",o:["give","return","print","def"],a:1},{q:"What does a function without return give back?",o:["0","An error","None","An empty string"],a:2},{q:"def add(a, b): return a + b. What is add(2, 3)?",o:["23","5","None","Error"],a:1}]}
]},

{t:"Functions in Depth",
b:`<p>Functions can have <b>default values</b>: <code>def greet(name, greeting="Hello")</code> lets callers skip the second argument. You can also call with <b>keyword arguments</b> (<code>greet(greeting="Hi", name="Ali")</code>), which makes calls easier to read.</p>
<p><code>*args</code> collects extra positional arguments into a tuple and <code>**kwargs</code> collects extra keyword arguments into a dictionary. Write a <b>docstring</b> (a string as the first line inside the function) to describe what the function does; tools and <code>help()</code> can display it.</p>
<p><b>Scope:</b> a variable created inside a function is local to it. Python looks for names in this order: local, enclosing, global, built-in.</p>`,
c:`def greet(name, greeting="Hello"):
    """Return a greeting for name."""
    return f"{greeting}, {name}!"

def total(*args):
    return sum(args)

print(greet("Ali"), greet("Sara", greeting="Hi"))
print(total(1, 2, 3, 4))`,
m:`Never use a list or dict as a default value (<code>def f(x=[])</code>). It is created once and shared between calls. Use <code>None</code> and create the list inside the function.`,
q:[{q:"def f(x, y=2): return x*y. What is f(3)?",o:["3","5","6","Error"],a:2},{q:"*args collects extra arguments into a...",o:["list","tuple","dictionary","string"],a:1},{q:"A variable created inside a function is...",o:["Global","Local to that function","A constant","Shared with all functions"],a:1}]},
{t:"Comprehensions and Data Structures",
b:`<p>A <b>list comprehension</b> builds a list in one line: <code>[x*2 for x in range(5)]</code>. You can filter with a condition at the end: <code>[x for x in nums if x % 2 == 0]</code>. Use them when they stay readable; a normal loop is better for complicated logic.</p>
<p><b>Tuples</b> look like lists but cannot be changed after creation, which makes them safe for fixed data such as coordinates. <b>Sets</b> store unique items only, so <code>set([1,1,2])</code> is <code>{1, 2}</code>, and they check membership quickly. Dictionaries have handy methods like <code>get(key, default)</code>, which avoids a KeyError.</p>
<p><code>sorted(items, key=...)</code> sorts by any rule, for example by the length of each word.</p>`,
c:`nums = [1, 2, 3, 4, 5, 6]
evens = [n * n for n in nums if n % 2 == 0]
print(evens)
print(set([1, 1, 2, 3, 3]))
point = (3, 4)
words = ["banana", "kiwi", "apple"]
print(sorted(words, key=len))
d = {"a": 1}
print(d.get("b", 0))`,
m:`Tuples with one item need a comma: <code>(5,)</code> is a tuple, <code>(5)</code> is just the number 5.`,
q:[{q:"What is [x*2 for x in range(3)]?",o:["[0, 2, 4]","[2, 4, 6]","[0, 1, 2]","[1, 2, 3]"],a:0},{q:"Which structure removes duplicates?",o:["list","tuple","set","str"],a:2},{q:"Tuples are...",o:["Mutable","Immutable","Only numbers","Only pairs"],a:1}]},
{t:"Files and Error Handling",
b:`<p>Use <code>with open("file.txt", "w") as f:</code> to work with files. The <code>with</code> block closes the file automatically, even if something goes wrong. Modes: <code>"r"</code> read, <code>"w"</code> write (erases old content), <code>"a"</code> append. Methods: <code>read()</code>, <code>readlines()</code>, <code>write()</code>.</p>
<p>Errors are called <b>exceptions</b>. Wrap risky code in <code>try</code> and handle specific problems with <code>except</code>, such as <code>ValueError</code> for bad conversions or <code>FileNotFoundError</code> for missing files. <code>else</code> runs if nothing failed and <code>finally</code> always runs. Catch specific exceptions rather than a bare <code>except:</code>, so you don't hide real bugs.</p>
<p>In this page's editor, files exist only in the browser's temporary memory and disappear when you refresh.</p>`,
c:`with open("notes.txt", "w") as f:
    f.write("Line 1\nLine 2\n")

with open("notes.txt") as f:
    for line in f:
        print(line.strip())

try:
    n = int("abc")
except ValueError:
    print("That is not a number")
finally:
    print("Done")`,
m:`Opening a file with <code>"w"</code> deletes what was in it. Use <code>"a"</code> to add to the end.`,
q:[{q:"Main benefit of 'with open(...)'?",o:["Faster reading","Closes the file automatically","Encrypts the file","Creates folders"],a:1},{q:"int('abc') raises...",o:["TypeError","ValueError","KeyError","IndexError"],a:1},{q:"A finally block runs...",o:["Only on error","Only on success","Always","Never"],a:2}]},
{t:"Modules and the Standard Library",
b:`<p>A <b>module</b> is a Python file you can reuse with <code>import</code>. Python ships with a large standard library: <code>math</code> (<code>sqrt</code>, <code>pi</code>), <code>random</code> (<code>randint</code>, <code>choice</code>), <code>datetime</code> (dates and times), <code>json</code> (data storage) and more. Use <code>import math</code> then <code>math.sqrt(16)</code>, or <code>from math import sqrt</code>.</p>
<p>Third-party packages are installed on your own computer with <code>pip install package-name</code>; that does not work inside this page's editor. Use a virtual environment (<code>python -m venv venv</code>) per project to keep packages separate.</p>
<p>The line <code>if __name__ == "__main__":</code> runs code only when the file is run directly, not when it is imported. You will see it in most professional scripts.</p>`,
c:`import math, random
from datetime import date

print(math.sqrt(16), round(math.pi, 3))
print(random.randint(1, 6))   # 1 to 6, both included
print(random.choice(["red", "green", "blue"]))
print(date.today().year)

if __name__ == "__main__":
    print("Running directly")`,
m:`Don't name your own file after a module (like <code>random.py</code>). Python will import your file instead of the real module.`,
q:[{q:"math.sqrt(16) returns...",o:["4","4.0","16","Error"],a:1},{q:"random.randint(1, 6) can return...",o:["1 to 5","1 to 6","0 to 6","2 to 6"],a:1},{q:"if __name__ == '__main__' runs the block when...",o:["The file is imported","The file is run directly","Always","Never"],a:1}]},
{t:"Object-Oriented Programming Basics",
b:`<p>A <b>class</b> is a blueprint and an <b>object</b> is one thing built from it. Classes bundle data (attributes) and behaviour (methods). <code>__init__</code> runs when an object is created and sets up its attributes; <code>self</code> refers to the object itself and is the first parameter of every method.</p>
<p><b>Inheritance</b> lets a new class reuse another: <code>class Dog(Animal)</code> gets everything from <code>Animal</code> and can override methods. Define <code>__str__</code> to control what <code>print(obj)</code> shows.</p>
<p>OOP is useful when you model real things with their own data, such as students, bank accounts or game characters. It is not required for every program, so choose it when it makes the code clearer.</p>`,
c:`class Animal:
    def __init__(self, name):
        self.name = name
    def speak(self):
        return f"{self.name} makes a sound"

class Dog(Animal):
    def speak(self):
        return f"{self.name} says Woof"
    def __str__(self):
        return f"Dog({self.name})"

pets = [Animal("Generic"), Dog("Rex")]
for p in pets:
    print(p.speak())
print(pets[1])`,
m:`Forgetting <code>self</code> as the first parameter of a method, or forgetting <code>self.</code> before an attribute name.`,
q:[{q:"__init__ is called when...",o:["An object is deleted","An object is created","A file opens","A loop ends"],a:1},{q:"What does 'self' refer to?",o:["The class","The current object","The module","A parent class"],a:1},{q:"class Dog(Animal) means Dog...",o:["Contains Animal","Inherits from Animal","Deletes Animal","Is a function"],a:1}]},
{t:"Project: Expense Tracker",
b:`<p>Now combine everything. An expense tracker stores expenses as a list of dictionaries, uses functions to add and total them, groups spending by category, and saves data with the <code>json</code> module. <code>json.dumps()</code> turns Python data into a string you can save; <code>json.loads()</code> turns it back.</p>
<p>Plan before coding: (1) what data do I store? (2) which functions do I need? (3) how do I test each part? Build one function at a time and test it with print statements.</p>
<p><b>Challenges:</b> add a function that finds the biggest expense, let the user enter expenses with <code>input()</code> and validate them with try/except, save to a file with <code>open()</code> and load it again next time, then rewrite it using a class. Put the finished project on GitHub with a README: it is good portfolio material.</p>`,
c:`import json
expenses = []

def add(item, amount, category):
    expenses.append({"item": item, "amount": amount, "category": category})

def by_category():
    result = {}
    for e in expenses:
        result[e["category"]] = result.get(e["category"], 0) + e["amount"]
    return result

add("Book", 12.5, "study")
add("Lunch", 4, "food")
add("Pens", 3, "study")
print(by_category())
print(json.dumps(expenses))`,
m:`Save early and test often. When something breaks, read the last line of the error message first: it names the problem type and the line number.`,

]}};

  if(!py){out.textContent="Loading Python (first run only)...";
   await new Promise((r,e)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";s.onload=r;s.onerror=e;document.head.appendChild(s)});
   py=await loadPyodide()}
  let text="";py.setStdout({batched:s=>text+=s+"\n"});py.setStderr({batched:s=>text+=s+"\n"});
  try{await py.runPythonAsync(document.getElementById("code").value)}catch(e){text+=String(e.message).split("\n").slice(-3).join("\n")}
  out.textContent=text||"(no output)";
 }catch(e){out.textContent="Could not load Python. Check your internet connection."}
 btn.disabled=false}
home();
</script></body></html>
