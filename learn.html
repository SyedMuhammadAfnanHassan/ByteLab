<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ByteLab Learning Lab</title><link rel="icon" href="assets/bytelab-logo.svg">
<style>
:root{--bg:#07111f;--card:#0c1a2b;--line:#20344d;--tx:#f5f9ff;--mu:#9db0c8;--a:#36d1dc;--b:#6675ff;--ok:#55d98b;--bad:#ff707b}
*{box-sizing:border-box}body{margin:0;background:#07111f;color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.6}main{width:min(1000px,92%);margin:auto;padding:30px 0 70px}a{color:#8ee8ee}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.brand{font-weight:800;font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.bar{height:10px;background:#17283d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}.btn{font:inherit;cursor:pointer;border:1px solid #2b4665;background:#0b192a;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:linear-gradient(100deg,#2ccbd6,#6374ff);border:0}.btn:disabled{opacity:.55}.lessonRow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:var(--mu)}.done{color:var(--ok);font-weight:700}.bad{color:var(--bad)}.quizOption{display:block;width:100%;text-align:left;margin:8px 0;background:#091625}.quizOption.correct{border-color:var(--ok);background:#0b2a1b}.quizOption.wrong{border-color:var(--bad);background:#321316}pre,textarea{width:100%;background:#030911;color:#eaf4ff;border:1px solid var(--line);border-radius:10px;padding:14px;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}textarea{min-height:210px;resize:vertical}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #2b4665;padding:4px 8px;border-radius:999px;color:#b8d4f4;font-size:12px}.lessonNav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.tip{border-left:3px solid var(--a);padding-left:14px;color:#cfe1f3}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.lessonNav{flex-direction:column}}
</style>
</head>
<body><main id="app"></main>
<script>
const BEGINNER=[
{t:"Getting Started: print, variables and types",b:`<p>Python programs are instructions executed by the interpreter. <code>print()</code> displays output. A variable gives a name to a value using <code>=</code>. Common types include <code>int</code>, <code>float</code>, <code>str</code> and <code>bool</code>.</p><p class="tip">Remember: <code>=</code> assigns a value. It does not ask whether two values are equal.</p>`,c:`name = "Afnan"
age = 17
height = 1.75
print("Hello,", name)
print(type(age))
print(type(height))`,q:[["Which line creates a variable?",["print(x)","x = 5","5 = x","# x = 5"],1],["What type is 3.14?",["int","str","float","bool"],2]]},
{t:"Input, operators and strings",b:`<p><code>input()</code> returns text. Convert it with <code>int()</code> or <code>float()</code> before numerical calculations. Python supports arithmetic operators such as <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>, <code>//</code>, <code>%</code> and <code>**</code>.</p>`,c:`name = input("Name: ")
age = int(input("Age: "))
print(f"Hello {name}. Next year you will be {age + 1}.")`,q:[["What does input() return?",["int","float","str","It depends"],2],["What is 7 // 2?",["3.5","3","4","1"],1]]},
{t:"Making decisions with if / elif / else",b:`<p>Conditional statements let a program choose between paths. Comparison operators include <code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code> and <code>&gt;=</code>. Indentation defines the block.</p>`,c:`marks = 72
if marks >= 80:
    print("A")
elif marks >= 60:
    print("B")
else:
    print("Keep practising")`,q:[["Which operator checks equality?",["=","==","=>","!="],1],["What does the example print for 72?",["A","B","Keep practising","Nothing"],1]]},
{t:"Loops: for and while",b:`<p>A <code>for</code> loop repeats over items or a range. <code>range(1, 6)</code> produces 1 through 5. A <code>while</code> loop repeats while its condition remains true.</p>`,c:`for number in range(1, 6):
    print(number)

count = 3
while count > 0:
    print("Countdown", count)
    count -= 1`,q:[["What does range(3) produce?",["1, 2, 3","0, 1, 2","0, 1, 2, 3","1, 2"],1],["A while loop stops when...",["It runs 10 times","Its condition becomes False","Python gets bored","It reaches the last line"],1]]},
{t:"Lists and dictionaries",b:`<p>A list stores an ordered collection. Indexing starts at 0. Dictionaries store key-value pairs. Both are core tools for organizing program data.</p>`,c:`scores = [72, 85, 91]
scores.append(88)
print(scores[0], len(scores))

student = {"name": "Afnan", "grade": "A"}
print(student["name"])`,q:[["Index of the first list item?",["1","0","-1","first"],1],["How do you read key 'name' from d?",["d.name","d(name)","d['name']","d{name}"],2]]},
{t:"Functions",b:`<p>Functions package reusable logic. Define one with <code>def</code>. Parameters let callers provide data and <code>return</code> sends a result back.</p>`,c:`def average(a, b, c):
    return (a + b + c) / 3

result = average(80, 70, 90)
print(result)`,q:[["Which keyword sends a value back?",["give","return","print","def"],1],["What does a function without return give back?",["0","An error","None","An empty string"],2]]},
{t:"Files and data",b:`<p>Programs can persist information in files. Use <code>open()</code> with a mode such as <code>"r"</code> for reading or <code>"w"</code> for writing. A <code>with</code> block closes the file automatically.</p>`,c:`with open("notes.txt", "w") as file:
    file.write("ByteLab")

with open("notes.txt", "r") as file:
    print(file.read())`,q:[["Which mode writes to a file?",["r","w","x","read"],1],["Why use 'with open(...)'?",["It closes the file automatically","It makes Python faster","It imports a library","It creates a loop"],0]]},
{t:"Errors and debugging",b:`<p>Errors are part of programming. Syntax errors stop code from being parsed. Exceptions happen while a program runs. <code>try/except</code> lets you handle expected exceptions and provide useful feedback.</p>`,c:`try:
    age = int("abc")
except ValueError:
    print("Please enter a valid integer.")`,q:[["Which exception does int('abc') raise?",["ValueError","KeyError","IndexError","NameError"],0],["What is debugging?",["Finding and fixing problems","Deleting code","Installing Python","Writing comments"],0]]},
{t:"Modules and imports",b:`<p>Modules let you reuse code. Python includes a standard library with useful modules. Import only what your program needs and keep dependencies documented.</p>`,c:`import math

radius = 5
area = math.pi * radius ** 2
print(area)`,q:[["How do you import math?",["use math","include math","import math","load math"],2],["What does math.pi represent?",["A random number","π","A string","A list"],1]]},
{t:"Final beginner project: Grade Manager",b:`<p>Bring the fundamentals together. Build a program that accepts several student marks, calculates an average and assigns a grade. Aim for clear functions, input validation and readable output.</p><p><b>Extension:</b> save the results to a text file.</p>`,c:`def average(marks):
    return sum(marks) / len(marks)

marks = [80, 72, 91, 88]
avg = average(marks)

if avg >= 80:
    grade = "A"
elif avg >= 60:
    grade = "B"
else:
    grade = "C"

print("Average:", avg)
print("Grade:", grade)`,q:[["What should a good final project demonstrate?",["Only print()","Several concepts working together","Only comments","No functions"],1],["Why validate user input?",["To make the program safer and more reliable","To make it longer","To avoid variables","It is never useful"],0]]}
];

const INTERMEDIATE=[
{t:"Functions in depth",b:`<p>Use default arguments, keyword arguments and clear return values to design reusable functions. Keep functions focused on one job.</p>`,c:`def greet(name, prefix="Hello"):
    return f"{prefix}, {name}!"

print(greet("Afnan"))
print(greet("Sara", prefix="Welcome"))`,q:[["What is a default argument?",["A value used when no argument is supplied","A syntax error","A loop","A module"],0]]},
{t:"List comprehensions",b:`<p>List comprehensions provide a compact way to transform or filter iterables. Use them when they remain readable.</p>`,c:`numbers = [1, 2, 3, 4, 5]
squares = [n * n for n in numbers]
evens = [n for n in numbers if n % 2 == 0]
print(squares)
print(evens)`,q:[["What does [n*n for n in numbers] create?",["A dictionary","A list of squares","A string","A function"],1]]},
{t:"Object-oriented programming",b:`<p>Classes define objects with data and behavior. <code>__init__</code> initializes instance attributes and methods operate on the object.</p>`,c:`class Student:
    def __init__(self, name):
        self.name = name

    def introduce(self):
        return f"I am {self.name}"

student = Student("Afnan")
print(student.introduce())`,q:[["What is self?",["The current instance","A module","A loop","A file"],0]]},
{t:"Working with JSON",b:`<p>JSON is common for storing structured data and communicating with web APIs. Python's <code>json</code> module converts between JSON text and Python objects.</p>`,c:`import json

student = {"name": "Afnan", "score": 92}
text = json.dumps(student)
print(text)
print(json.loads(text)["score"])`,q:[["Which function converts a Python object to JSON text?",["json.dumps","json.loads","json.open","json.text"],0]]},
{t:"APIs and requests",b:`<p>Web APIs let programs exchange data. Learn HTTP basics, status codes, JSON responses and safe handling of network failures. This example uses the standard library so no third-party package is required.</p>`,c:`from urllib.request import urlopen
import json

# Example only: fetch a public JSON endpoint
# with urlopen("https://example.com/data.json") as response:
#     data = json.load(response)
#     print(data)`,q:[["What format is commonly returned by modern APIs?",["JSON","MP3","PNG only","EXE"],0]]},
{t:"Testing",b:`<p>Tests turn assumptions into repeatable checks. Start with small functions and test normal cases, edge cases and invalid inputs.</p>`,c:`def add(a, b):
    return a + b

assert add(2, 3) == 5
assert add(-1, 1) == 0
print("Tests passed")`,q:[["What does assert do?",["Checks that a condition is true","Creates a class","Downloads a file","Starts a server"],0]]},
{t:"Project architecture",b:`<p>Larger programs become easier to maintain when responsibilities are separated into modules. Plan data flow, functions, error handling and tests before adding features.</p>`,c:`# Example structure:
# app.py          -> program entry point
# models.py       -> data structures
# services.py     -> core logic
# tests/          -> automated tests`,q:[["Why split a larger program into modules?",["To separate responsibilities and improve maintainability","To hide all code","To make every file identical","It is required by Python"],0]]},
{t:"Intermediate capstone",b:`<p>Build a command-line Student Management System. Include add/search/update/delete operations, persistent storage, input validation and tests.</p>`,c:`students = {}

def add_student(student_id, name):
    students[student_id] = {"name": name}

add_student("001", "Afnan")
print(students)`,q:[["What should a capstone demonstrate?",["Integrated skills and thoughtful design","Only syntax memorization","A copied tutorial","No testing"],0]]}
];

const app=document.getElementById("app");
let pyodide=null, course=(new URLSearchParams(location.search).get("course")||"beginner").toLowerCase();
let lessons=course==="intermediate"?INTERMEDIATE:BEGINNER;
const key=course==="intermediate"?"bl_py_intermediate":"bl_py_progress";

function load(){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch(e){return{}}}
function save(p){localStorage.setItem(key,JSON.stringify(p))}
function pct(){const p=load();return Math.round(Object.keys(p).length/lessons.length*100)}
function shell(content){app.innerHTML=`<div class="top"><a class="brand" href="index.html">ByteLab</a><a href="index.html">← Home</a></div>${content}`}
function home(){
 const p=load(),n=Object.keys(p).length;
 shell(`<h1>Python ${course==="intermediate"?"Builder":"Foundations"}</h1><p class="muted">${course==="intermediate"?"Build stronger Python skills for real projects.":"Start from fundamentals and build your first useful programs."}</p>
 <div class="card"><div class="lessonRow"><b>${n}/${lessons.length} lessons complete</b><span>${pct()}%</span></div><div class="bar"><i style="width:${pct()}%"></i></div></div>
 <div class="grid">${lessons.map((w,i)=>`<article class="card"><span class="muted">LESSON ${i+1}</span><h3>${w.t}</h3><p>${p[i]?"<span class='done'>✓ Completed</span>":"Learn, practise and pass the quiz."}</p><button class="btn primary" onclick="lesson(${i})">${p[i]?"Review":"Start lesson"}</button></article>`).join("")}</div>`);
}
function lesson(i){
 const w=lessons[i],p=load();let correct=new Set();
 shell(`<a href="#" onclick="home();return false">← Course overview</a><h1>Lesson ${i+1}: ${w.t}</h1><div class="meta"><span class="pill">${course==="intermediate"?"Intermediate":"Beginner"}</span><span class="pill">${i+1} of ${lessons.length}</span></div>
 <div class="card">${w.b}<h3>Example</h3><pre>${esc(w.c)}</pre></div>
 <h2>Quick check</h2><div id="quiz">${w.q.map((q,qi)=>`<div class="card"><b>${q[0]}</b>${q[1].map((o,oi)=>`<button class="btn quizOption" data-q="${qi}" data-o="${oi}">${esc(o)}</button>`).join("")}</div>`).join("")}</div>
 <div id="quizMsg" class="card muted">Answer every question correctly to complete this lesson.</div>
 <h2>Practice lab</h2><div class="card"><p class="muted">Edit the code and run it in your browser. Python is powered by Pyodide; the first run may take a little longer.</p><textarea id="code" spellcheck="false">${esc(w.c)}</textarea><div class="actions"><button class="btn primary" id="run">▶ Run Python</button><button class="btn" id="example">Reset example</button></div><pre id="out">Output will appear here.</pre></div>
 <div class="lessonNav">${i>0?`<button class="btn" onclick="lesson(${i-1})">← Previous</button>`:"<span></span>"}${i<lessons.length-1?`<button class="btn primary" onclick="lesson(${i+1})">Next →</button>`:`<button class="btn primary" onclick="home()">Finish course →</button>`}</div>`);
 document.querySelectorAll(".quizOption").forEach(btn=>btn.onclick=()=>{
   const qi=+btn.dataset.q,oi=+btn.dataset.o;
   if(oi===w.q[qi][2]){btn.classList.add("correct");correct.add(qi);document.querySelectorAll(`[data-q="${qi}"]`).forEach(x=>x.disabled=true)}
   else btn.classList.add("wrong");
   if(correct.size===w.q.length){p[i]=1;save(p);document.getElementById("quizMsg").innerHTML="<span class='done'>✓ Lesson complete! Your progress is saved on this device.</span>"}
 });
 document.getElementById("example").onclick=()=>document.getElementById("code").value=w.c;
 document.getElementById("run").onclick=runPython;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
async function runPython(){
 const out=document.getElementById("out"),btn=document.getElementById("run");btn.disabled=true;out.textContent="Loading Python…";
 try{
  if(!pyodide){const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;document.head.appendChild(s)});pyodide=await loadPyodide()}
  let text="";pyodide.setStdout({batched:s=>text+=s+"\n"});pyodide.setStderr({batched:s=>text+=s+"\n"});
  try{await pyodide.runPythonAsync(document.getElementById("code").value)}catch(e){text+=String(e)}
  out.textContent=text||"(no output)";
  const n=+(localStorage.getItem("bl_quest_attempts")||0);localStorage.setItem("bl_quest_attempts",String(n+1));
 }catch(e){out.textContent="Python could not load. Check your internet connection and try again."}
 btn.disabled=false;
}
if(new URLSearchParams(location.search).get("challenge")==="today"){
 const d=Math.floor(Date.now()/86400000);
 location.href="index.html#challenges";
}else home();
</script>
</body>
</html>
